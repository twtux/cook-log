<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1613">
<meta name="description" content="A private, local-first BBQ cook journal that works offline.">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta http-equiv="Permissions-Policy" content="camera=(), geolocation=(), payment=(), usb=()">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cook Log">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Cook Log</title>
<style>
  :root {
    --ember: #c1440e;
    --ember-bright: #e85d20;
    --coal: #1a1613;
    --smoke: #efe9df;
    --ash: #8a8078;
    --char: #2a2320;
    --line: #3d342e;
    --grate: #b7ab9c;
    --good: #6fae5a;
    --gold: #d9a441;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--coal); color: var(--smoke);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    line-height: 1.5; padding: 0 0 100px;
  }
  a { color: var(--ember-bright); }
  header {
    padding: 20px 16px 16px; border-bottom: 1px solid var(--line);
    background: radial-gradient(120% 100% at 50% -20%, rgba(232,93,32,0.18), transparent 60%), var(--char);
    position: sticky; top: 0; z-index: 20; backdrop-filter: blur(3px);
  }
  .bar { display: flex; align-items: center; gap: 12px; max-width: 860px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand .flame { font-size: 22px; }
  .kicker { font-family: "SF Mono", ui-monospace, "Roboto Mono", monospace;
    font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ember-bright); margin: 0; }
  h1 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  main { padding: 8px 16px 0; max-width: 860px; margin: 0 auto; }

  button, .btn {
    font-family: "SF Mono", ui-monospace, monospace; font-size: 13px;
    border: 1px solid var(--line); background: var(--char); color: var(--smoke);
    padding: 9px 14px; border-radius: 9px; cursor: pointer; letter-spacing: 0.02em;
    transition: border-color .15s, background .15s; -webkit-appearance: none;
  }
  button:hover, .btn:hover { border-color: var(--ember); }
  .btn-primary { background: var(--ember); border-color: var(--ember); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--ember-bright); border-color: var(--ember-bright); }
  .btn-ghost { background: transparent; }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 7px; }
  .btn-danger:hover { border-color: #b5442f; color: #ff9a80; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* list */
  .toolbar { display: flex; gap: 10px; margin: 16px 0 8px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 160px; }
  input, textarea, select {
    width: 100%; background: rgba(255,255,255,0.02); color: var(--smoke);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    font-family: "SF Mono", ui-monospace, monospace; font-size: 14px;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ember); }
  textarea { min-height: 66px; resize: vertical; line-height: 1.45; }
  label.fl { display: block; font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.06em; color: var(--ash); text-transform: uppercase; margin: 0 0 5px; }
  .hint { color: var(--ash); font-size: 12px; font-family: "SF Mono", ui-monospace, monospace; }

  .cook-card {
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0;
    background: rgba(255,255,255,0.015); cursor: pointer; transition: border-color .15s, transform .05s;
  }
  .cook-card:hover { border-color: var(--ember); }
  .cook-card:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--ember-bright); outline-offset: 2px;
  }
  .cook-card:active { transform: scale(0.997); }
  .cc-top { display: flex; align-items: baseline; gap: 10px; }
  .cc-title { font-size: 18px; font-weight: 600; }
  .cc-date { margin-left: auto; color: var(--ash); font-size: 12px; font-family: "SF Mono", ui-monospace, monospace; white-space: nowrap; }
  .cc-meta { color: var(--grate); font-size: 13px; margin-top: 4px; font-family: "SF Mono", ui-monospace, monospace; }
  .cc-del { background: transparent; border: none; color: var(--ash); font-size: 15px; padding: 2px 4px; margin-left: 10px; cursor: pointer; line-height: 1; }
  .cc-del:hover { color: #ff9a80; border-color: transparent; }
  .pill { display: inline-block; font-family: "SF Mono", ui-monospace, monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--grate); margin-right: 6px; }
  .pill.vs { color: var(--ember-bright); border-color: var(--ember); }
  .scores { display: flex; gap: 14px; margin-top: 9px; }
  .score { text-align: center; }
  .score b { display: block; font-size: 19px; font-family: "SF Mono", ui-monospace, monospace; color: var(--gold); }
  .score span { font-size: 10px; color: var(--ash); text-transform: uppercase; letter-spacing: 0.08em; font-family: "SF Mono", ui-monospace, monospace; }
  .empty { text-align: center; color: var(--ash); padding: 60px 20px; }
  .empty .flame { font-size: 40px; display: block; margin-bottom: 12px; }

  /* form */
  section.card { border: 1px solid var(--line); border-radius: 12px; margin: 16px 0; overflow: hidden; background: rgba(255,255,255,0.015); }
  .sec-head { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; background: var(--char); border-bottom: 1px solid var(--line); }
  .sec-title { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--grate); font-weight: 600; font-family: "SF Mono", ui-monospace, monospace; }
  .fields { padding: 12px 16px 16px; }
  .fg { margin-bottom: 12px; }
  .fg:last-child { margin-bottom: 0; }
  .sides { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .sides.two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 620px) { .sides.two { grid-template-columns: 1fr; } }
  .side { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .side-head { padding: 9px 12px; background: rgba(193,68,14,0.10); border-bottom: 1px solid var(--line);
    font-family: "SF Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--ember-bright); }
  .side .fields { padding: 12px; }
  .range-row { display: flex; align-items: center; gap: 12px; }
  input[type=range] { accent-color: var(--ember); padding: 0; }
  .range-val { font-family: "SF Mono", ui-monospace, monospace; font-size: 15px; color: var(--gold); min-width: 34px; text-align: right; }

  /* detail */
  .detail-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 16px 0 4px; }
  .detail-h h2 { margin: 0; font-size: 24px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-family: "SF Mono", ui-monospace, monospace; font-size: 13px; padding: 12px 16px; }
  .kv dt { color: var(--ash); }
  .kv dd { margin: 0; color: var(--smoke); }
  .cmp-table { width: 100%; border-collapse: collapse; font-family: "SF Mono", ui-monospace, monospace; font-size: 13px; }
  .cmp-table th, .cmp-table td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .cmp-table th { color: var(--ash); font-weight: 400; }
  .cmp-table td.metric { color: var(--grate); white-space: nowrap; }
  .cmp-table thead th { color: var(--ember-bright); }
  .winner { color: var(--good); }
  .foot-actions { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: linear-gradient(transparent, var(--coal) 30%);
    display: flex; gap: 10px; justify-content: center; z-index: 15; }
  .foot-actions .inner { display: flex; gap: 10px; max-width: 860px; width: 100%; }
  .toast { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); background: var(--char);
    border: 1px solid var(--ember); color: var(--smoke); padding: 10px 16px; border-radius: 10px;
    font-family: "SF Mono", ui-monospace, monospace; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; }
  .notice { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; margin: 12px 0;
    background: rgba(217,164,65,0.07); color: var(--grate); font-family: "SF Mono", ui-monospace, monospace; font-size: 12px; }
  .notice b { color: var(--gold); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 40; padding: 20px; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--char); border: 1px solid var(--line); border-radius: 14px; max-width: 560px; width: 100%; padding: 20px; max-height: 84vh; overflow: auto; }
  .modal h3 { margin: 0 0 12px; }
  pre.md { white-space: pre-wrap; word-break: break-word; background: var(--coal); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; font-family: "SF Mono", ui-monospace, monospace; font-size: 12px; color: var(--grate); line-height: 1.5; }
  .timeline { list-style: none; margin: 12px 0 0; padding: 0; }
  .timeline li { padding: 9px 0; border-bottom: 1px solid rgba(61,52,46,0.5); font-family: "SF Mono", ui-monospace, monospace; font-size: 14px; }
  .timeline li:last-child { border-bottom: none; }
  .timeline .t { color: var(--gold); margin-right: 10px; }
  .sidebtn.on { border-color: var(--ember); color: var(--ember-bright); background: rgba(193,68,14,0.12); }
  .quickbtn { font-size: 14px !important; padding: 11px 15px !important; }
  /* wizard */
  .wizard { max-width: 560px; margin: 0 auto; padding-top: 6px; }
  .wiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; min-height: 30px; }
  .wiz-step { font-family: "SF Mono", ui-monospace, monospace; font-size: 11px; color: var(--ash); letter-spacing: 0.12em; text-transform: uppercase; }
  .wiz-q { font-size: 25px; font-weight: 600; line-height: 1.2; margin: 6px 0 6px; letter-spacing: -0.01em; }
  .wiz-sub { color: var(--ash); font-size: 14px; font-family: "SF Mono", ui-monospace, monospace; margin-bottom: 18px; line-height: 1.5; }
  .wiz-input { font-size: 17px; padding: 14px; }
  textarea.wiz-input { min-height: 96px; }
  .wiz-choices { display: grid; gap: 12px; margin-top: 8px; }
  .wiz-choice { text-align: left; padding: 18px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; cursor: pointer; }
  .wiz-choice b { font-size: 18px; }
  .wiz-choice span { font-size: 13px; color: var(--ash); font-family: "SF Mono", ui-monospace, monospace; }
  .wiz-choice.on { border-color: var(--ember); background: rgba(193,68,14,0.10); }
  .idea-card { border: 1px solid var(--ember); background: rgba(193,68,14,0.10); border-radius: 12px;
    padding: 14px 16px; margin: 12px 0 16px; }
  .idea-card b { color: var(--gold); }
  .idea-card p { margin: 5px 0 0; color: var(--grate); font-family: "SF Mono", ui-monospace, monospace; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 20px; padding: 10px 15px; font-size: 14px; }
  .chip.on { border-color: var(--ember); background: rgba(193,68,14,0.14); color: var(--ember-bright); }
  .wiz-nav { display: flex; gap: 10px; margin-top: 24px; }
  .wiz-nav .btn-primary { flex: 1; }
  /* voice */
  .field-row { display: flex; gap: 8px; align-items: stretch; }
  .field-row > input, .field-row > textarea { flex: 1; }
  .mic { padding: 0 15px; font-size: 17px; border-radius: 9px; white-space: nowrap; }
  .mic.listening { border-color: var(--ember); background: rgba(193,68,14,0.18); color: var(--ember-bright); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  /* ambient smoker + smoke background (original art, no branded assets) */
  .smokebg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  main { position: relative; z-index: 1; }
  .pit { position: absolute; right: -20px; bottom: -14px; width: 420px; height: 340px; }
  .pit svg { position: absolute; right: 0; bottom: 0; width: 420px; height: auto; color: #000; opacity: 0.16; }
  .smoke { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(212,206,196,0.55), rgba(212,206,196,0) 70%); filter: blur(7px); opacity: 0; }
  .smoke.a { right: 100px; bottom: 212px; width: 46px; height: 46px; animation: rise 7s ease-in infinite; }
  .smoke.b { right: 108px; bottom: 210px; width: 34px; height: 34px; animation: rise 9s ease-in infinite 2.4s; }
  .smoke.c { right: 92px; bottom: 208px; width: 58px; height: 58px; animation: rise 8s ease-in infinite 4.6s; }
  @keyframes rise { 0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; } 12% { opacity: 0.5; } 55% { opacity: 0.3; } 100% { transform: translateY(-210px) translateX(-26px) scale(1.7); opacity: 0; } }
  @media (max-width: 520px) { .pit { width: 300px; height: 250px; right: -28px; } .pit svg { width: 300px; } .smoke.a { right: 72px; bottom: 150px; } .smoke.b { right: 78px; bottom: 149px; } .smoke.c { right: 66px; bottom: 148px; } }
  @media (prefers-reduced-motion: reduce) { .smoke { animation: none !important; opacity: 0.16; } }
</style>
</head>
<body>
<div class="smokebg" aria-hidden="true">
  <div class="pit">
    <svg viewBox="0 0 400 300" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <rect x="120" y="235" width="14" height="60" rx="5"/>
      <rect x="250" y="235" width="14" height="60" rx="5"/>
      <circle cx="127" cy="298" r="15"/>
      <circle cx="257" cy="298" r="15"/>
      <rect x="34" y="180" width="70" height="70" rx="10"/>
      <rect x="30" y="205" width="12" height="24" rx="4"/>
      <rect x="90" y="150" width="230" height="95" rx="47"/>
      <rect x="180" y="136" width="46" height="12" rx="6"/>
      <rect x="286" y="88" width="28" height="66" rx="5"/>
      <rect x="280" y="82" width="40" height="10" rx="5"/>
    </svg>
    <span class="smoke a"></span><span class="smoke b"></span><span class="smoke c"></span>
  </div>
</div>
<header>
  <div class="bar">
    <div class="brand" onclick="go('/')">
      <span class="flame">🔥</span>
      <div><p class="kicker">Tom Wood · BBQ</p><h1>Cook Log</h1></div>
    </div>
    <div class="spacer"></div>
    <button class="btn-sm btn-ghost" onclick="go('/clock')">🕒 Clock</button>
    <button class="btn-sm btn-ghost" onclick="go('/inventory')">Inventory</button>
    <button class="btn-sm btn-ghost" id="installBtn" onclick="installApp()">Install</button>
    <button class="btn-sm btn-ghost" onclick="openData()">Data</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Cook Log — single-file, offline BBQ cook tracker. Data lives in localStorage.
   Unified model: every cook has 1+ "sides" (1 = single cook, 2 = head-to-head),
   so comparison is first-class. Exports markdown (paste into cook-log.md) + JSON
   (full backup). No build, no server, no deps — drops onto any static host.
--------------------------------------------------------------------------- */
const KEY = 'cooklog.v1';
const LAST_BACKUP_KEY='cooklog.last-backup.v1';
const RECOVERY_KEY='cooklog.recovery.v1';
const IDB_NAME='cook-log-device-store';
const IDB_STORE='snapshots';
const COOKERS = ['Spider Huntsman', 'Traeger 565', 'Weber kettle'];
const QUICK_EVENTS = ['Fire lit', 'Meat on', 'Stall', 'Wrapped', 'Probe check', 'Spritz', 'Pulled', 'Rested'];
let evtSide = 'Both';
let wiz = null;

// Per-side fields, grouped. score:true renders a 1-10 slider.
const SIDE_GROUPS = [
  { title: 'The Fire', fields: [
    { k:'fuel', label:'Fuel', ph:'lump / briquette / pellet — brand' },
    { k:'wood', label:'Wood', ph:'species + chunks vs pellets, how many' },
    { k:'config', label:'Config', ph:'two-zone / deflectors / rotisserie' },
    { k:'targetTemp', label:'Target grate temp', ph:'e.g. 250°F' },
    { k:'tempHeld', label:'Temp actually held', ph:'steady? did it swing?' },
    { k:'thermometer', label:'Thermometer of record', ph:'Tel-Tru / Venom probe / dome' },
    { k:'smokeQuality', label:'Smoke before meat on', ph:'thin blue? white billow? cleanup time' },
  ]},
  { title: 'The Timeline', fields: [
    { k:'weightStart', label:'Start weight', ph:'e.g. 14 lb' },
    { k:'onGrate', label:'On the grate (time)', ph:'e.g. 6:10 AM' },
    { k:'stall', label:'Stall — start / temp', ph:'e.g. 9:40, 152°F' },
    { k:'wrapped', label:'Wrapped? (when / in what)', ph:'butcher paper at 165°' },
    { k:'hitTarget', label:'Hit target internal at', ph:'time' },
    { k:'totalTime', label:'Total cook time', ph:'e.g. 8h 20m' },
    { k:'pulledTemp', label:'Pulled at internal temp', ph:'e.g. 203°F' },
    { k:'probeFeel', label:'Probe feel at pull', ph:'slid like butter? resistance?' },
    { k:'rest', label:'Rest — how long / where', ph:'2h in a cooler' },
  ]},
  { title: 'The Result', fields: [
    { k:'smokeRing', label:'Smoke ring depth', ph:'e.g. 1/4 inch' },
    { k:'bark', label:'Bark', ph:'set? soft? color' },
    { k:'sauce', label:'Sauce / finish', ph:'if any' },
    { k:'smokeScore', label:'Smoke intensity', score:true },
    { k:'moistureScore', label:'Moisture / tenderness', score:true },
    { k:'tasteScore', label:'Overall taste', score:true },
  ]},
];

// ---- storage ----
function load() {
  try {
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(!raw||!Array.isArray(raw.cooks)) return { cooks: [] };
    const seen=new Set();
    return { cooks:raw.cooks.map(c=>normalizeCook(c,seen)).filter(Boolean) };
  } catch { return { cooks: [] }; }
}
function save(db) {
  try { localStorage.setItem(KEY,JSON.stringify(db)); mirrorDeviceData(); return true; }
  catch { toast('Could not save — browser storage may be full'); return false; }
}
function uid() { return 'c' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function nowLocal(){ const n=new Date(), p=x=>String(x).padStart(2,'0'); return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}T${p(n.getHours())}:${p(n.getMinutes())}`; }
function getCook(id) { return load().cooks.find(c => c.id === id); }

function textVal(v,max=10000){ return typeof v==='string'?v.slice(0,max):(v==null?'':String(v).slice(0,max)); }
function normalizeSide(raw){
  const s=newSide(textVal(raw&&raw.name,200));
  SIDE_GROUPS.forEach(g=>g.fields.forEach(f=>{
    const v=raw&&raw[f.k];
    s[f.k]=f.score?Math.max(0,Math.min(10,Number(v)||0)):textVal(v);
  }));
  return s;
}
function normalizeCook(raw,seen=new Set()){
  if(!raw||typeof raw!=='object'||!Array.isArray(raw.sides)||!raw.sides.length) return null;
  let id=textVal(raw.id,80);
  if(!/^[A-Za-z0-9_-]+$/.test(id)||seen.has(id)) id=uid();
  seen.add(id);
  const sides=raw.sides.slice(0,2).map(normalizeSide);
  const events=Array.isArray(raw.events)?raw.events.slice(0,5000).map(e=>({
    t:Number.isFinite(Number(e&&e.t))?Number(e.t):Date.now(),
    label:textVal(e&&e.label,1000), side:textVal(e&&e.side,200)
  })).filter(e=>e.label):[];
  return {
    id, createdAt:Number(raw.createdAt)||Date.now(), updatedAt:Number(raw.updatedAt)||Date.now(),
    mode:sides.length>1?'compare':'single', title:textVal(raw.title), date:textVal(raw.date,50),
    protein:textVal(raw.protein), plan:textVal(raw.plan), prep:textVal(raw.prep),
    sidesPlan:textVal(raw.sidesPlan), saucePlan:textVal(raw.saucePlan), events, sides,
    worked:textVal(raw.worked), change:textVal(raw.change), notes:textVal(raw.notes), verdict:textVal(raw.verdict),
    experience:Array.isArray(raw.experience)?raw.experience.slice(0,25).map(x=>textVal(x,40)).filter(Boolean):[],
    source:textVal(raw.source,40),
    steps:Array.isArray(raw.steps)?raw.steps.slice(0,60).map(s=>textVal(s,500)).filter(Boolean):[],
    stepsDone:Array.isArray(raw.stepsDone)?raw.stepsDone.filter(n=>Number.isInteger(n)):[]
  };
}

// ---- learned suggestions (your "inventory" from past cooks) ----
function distinct(arr){ return [...new Set(arr.map(v=>v==null?'':String(v).trim()).filter(Boolean))]; }
function pastCookers(){ return distinct([...loadInv().cookers, ...load().cooks.flatMap(c=>c.sides.map(s=>s.name))]); }
function pastProteins(){ return distinct(load().cooks.map(c=>c.protein)); }

function loadInv(){
  try{
    const v=JSON.parse(localStorage.getItem(INV_KEY));
    if(v&&v.cookers){
      const inv=Object.assign({}, INV_DEFAULTS, v);
      if(!localStorage.getItem(HERBES_MIGRATION_KEY)){
        inv.rubs=distinct(['Badia Herbes de Provence (salt-free)',...(inv.rubs||[])]);
        localStorage.setItem(INV_KEY,JSON.stringify(inv));
        localStorage.setItem(HERBES_MIGRATION_KEY,'1');
      }
      return inv;
    }
  }catch{}
  return JSON.parse(JSON.stringify(INV_DEFAULTS));
}
function saveInv(inv){ try{ localStorage.setItem(INV_KEY, JSON.stringify(inv)); mirrorDeviceData(); return true; }catch{ toast('Could not save inventory — browser storage may be full'); return false; } }

function removeInvItem(cat,idx){ const inv=loadInv(); inv[cat].splice(idx,1); saveInv(inv); renderInventory(document.getElementById('app')); }

// ---- helpers ----
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function jsArg(v){ return esc(JSON.stringify(String(v==null?'':v))); }
function mdCell(v){ return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/\|/g,'\\|').replace(/\r?\n/g,'<br>'); }
function fmtDate(v) {
  if (!v) return '—';
  const d = new Date(v); if (isNaN(d)) return v;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) +
    ' · ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}
function avgScore(side) {
  const s = [side.smokeScore, side.moistureScore, side.tasteScore].map(Number).filter(n => n > 0);
  return s.length ? (s.reduce((a,b)=>a+b,0)/s.length) : 0;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1900); }

// ---- routing ----
function go(path) { const h = '#' + path; if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', render);
window.addEventListener('load',()=>initDeviceStorage().finally(render));

function render() {
  const h = location.hash.slice(1) || '/';
  const app = document.getElementById('app');
  if (h === '/') { if(firstRun() && !forkcastHandoff()) return renderWelcome(app); return renderList(app); }
  if (h === '/welcome') return renderWelcome(app);
  if (h === '/inventory') return renderInventory(app);
  if (h === '/clock') return renderClock(app);
  if (h === '/start') return renderWizard(app);
  if (h === '/new/single') return renderForm(app, blankCook('single'), true);
  if (h === '/new/compare') return renderForm(app, blankCook('compare'), true);
  const mE = h.match(/^\/edit\/(.+)$/); if (mE) { const c = getCook(mE[1]); return c ? renderForm(app, c, false) : renderList(app); }
  const mD = h.match(/^\/cook\/(.+)$/); if (mD) { const c = getCook(mD[1]); return c ? renderDetail(app, c) : renderList(app); }
  if (h === '/recipes') return renderRecipes(app);
  if (h === '/recipe-new') return renderRecipeForm(app, blankRecipe(), true);
  const mRE = h.match(/^\/recipe-edit\/(.+)$/); if (mRE) { const r = getRecipe(mRE[1]); return r && !r.builtin ? renderRecipeForm(app, r, false) : renderRecipes(app); }
  const mR = h.match(/^\/recipe\/(.+)$/); if (mR) { const r = getRecipe(mR[1]); return r ? renderRecipeDetail(app, r) : renderRecipes(app); }
  renderList(app);
}

let searchQ = '';
function forkcastHandoff(){

    name:(p.get('name')||'').slice(0,120),

  }; } }catch(e){}
  return null;
}
function handoffBanner(){
  const h=forkcastHandoff(); if(!h||!h.name) return '';

  const ingHtml=lines(h.ings).length?`<div style="margin:8px 0 4px"><b>Ingredients${h.servings?` (serves ${esc(h.servings)})`:''}:</b><ul style="margin:5px 0;padding-left:20px">${lines(h.ings).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`:'';
  return `<div class="notice">📋 <b>From Forkcast</b> — you're making <b>${esc(h.name)}</b>.${ingHtml}<button class="btn-sm" onclick="startFromForkcast()">🔥 Log this cook</button> <button class="btn-sm btn-ghost" onclick="dismissHandoff()">Dismiss</button></div>`;
}
function startFromForkcast(){
  const h=forkcastHandoff(); if(!h) return;
  const c=blankCook('single'); c.title=h.name; c.source='forkcast';
  if(h.ings) c.notes='Ingredients'+(h.servings?` (serves ${h.servings})`:'')+': '+h.ings.split('\n').filter(Boolean).join(' · ');
  if(h.steps) c.steps=h.steps.split('\n').map(s=>s.trim()).filter(Boolean);

function dismissHandoff(){ try{history.replaceState(null,'',location.pathname+'#/');}catch(e){} render(); }
function cookResultsHtml() {
  const db = load();
  const cooks = db.cooks.slice().sort((a,b) => (b.date ? Date.parse(b.date)||b.createdAt : b.createdAt) - (a.date ? Date.parse(a.date)||a.createdAt : a.createdAt));
  const q = searchQ.trim().toLowerCase();
  const filtered = !q ? cooks : cooks.filter(c => JSON.stringify(c).toLowerCase().includes(q));
  return filtered.length ? cookGroups(filtered) : (cooks.length
    ? `<div class="empty">No cooks match "${esc(searchQ)}".</div>`
    : `<div class="empty"><span class="flame">🔥</span>What are we making?<br>Fire one up — hit <b>🔥 Start a cook</b>.</div>`);
}
function renderList(app) {
  const db = load();

    ${handoffBanner()}

      <input class="search" id="search" placeholder="Search cooks — protein, cooker, notes…" value="${esc(searchQ)}">
      <button class="btn-primary" onclick="startWizard()">🔥 Start a cook</button>
      <button class="btn-ghost btn-sm" onclick="go('/new/single')">full form</button>
    </div>
    <div id="cook-results">${cookResultsHtml()}</div>
  `;
  // Only re-render the results on input — leaving the search box in the DOM so
  // the caret never resets (recreating it caused characters to type backwards).
  const s = document.getElementById('search');

function backupReminder(db){
  if(!db.cooks.length)return '';
  const last=Number(localStorage.getItem(LAST_BACKUP_KEY))||0;
  if(Date.now()-last<14*24*60*60*1000)return '';
  return `<div class="notice"><b>Protect your cooks.</b> This device has not recorded a backup in the last 14 days. <button class="btn-sm" onclick="exportJSON()">Back up now</button></div>`;
}
function cookGroups(list){
  const planned = list.filter(c=>c.source==='forkcast');
  const freestyle = list.filter(c=>c.source!=='forkcast');
  const sec=(title,arr)=> arr.length ? `<div class="cc-meta" style="margin:14px 2px 6px;font-weight:600;color:var(--ember-bright)">${title} <span class="hint">· ${arr.length}</span></div>${arr.map(cookCard).join('')}` : '';
  if(planned.length && freestyle.length){
    return sec('🍽️ Planned in Forkcast', planned) + sec('🔥 Off the cuff', freestyle);

function cookCard(c) {
  const cookers = c.sides.map(s => s.name).filter(Boolean).join('  vs  ') || 'Cook';
  const title = c.title || c.protein || cookers;

  const scoreBlock = c.mode === 'compare'
    ? c.sides.map((s,i)=>`<div class="score"><b>${best[i]?best[i].toFixed(1):'–'}</b><span>${esc((s.name||('#'+(i+1))).split(' ')[0])}</span></div>`).join('')
    : `<div class="score"><b>${best[0]?best[0].toFixed(1):'–'}</b><span>avg</span></div>`;
  return `<div class="cook-card" role="link" tabindex="0" onclick="go('/cook/'+${jsArg(c.id)})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('/cook/'+${jsArg(c.id)})}">
    <div class="cc-top"><span class="cc-title">${esc(title)}</span><span class="cc-date">${esc(fmtDate(c.date))}</span><button class="cc-del" onclick="event.stopPropagation();delCook(${jsArg(c.id)})" aria-label="Delete cook" title="Delete">✕</button></div>
    <div class="cc-meta">
      ${c.mode==='compare'?'<span class="pill vs">Head-to-head</span>':''}
      ${c.source==='forkcast'?'<span class="pill">🍽️ Planned</span> ':''}
      ${esc(c.protein||'')}${c.protein?' · ':''}${esc(cookers)}
    </div>
    ${showScore?`<div class="scores">${scoreBlock}</div>`:''}
  </div>`;
}

  } else if(step===4){

      <div class="sides ${two?'two':''}">${wiz.cook.sides.map((s,si)=>fireSideForm(s,si,two)).join('')}</div>${wizNav(true)}`;
  } else {
    const names=wiz.cook.sides.map(s=>s.name).filter(Boolean).join(' vs ')||'your cook';
    const menu=[wiz.cook.sidesPlan&&`Sides: ${wiz.cook.sidesPlan}`,wiz.cook.saucePlan&&`Sauce: ${wiz.cook.saucePlan}`].filter(Boolean).join(' · ');

function sideForm(s, i, two) {
  return `<div class="side">

function fieldInput(s, i, f) {
  const id = `s${i}_${f.k}`;

    const v = Number(s[f.k])||0;

      <div class="range-row"><input type="range" min="0" max="10" step="1" id="${id}" value="${v}">
      <span class="range-val" id="${id}_v">${v||'–'}</span></div></div>`;
  }
  return `<div class="fg"><label class="fl">${f.label}</label><input id="${id}" list="dl_${f.k}" value="${esc(s[f.k])}" placeholder="${esc(f.ph||'')}"></div>`;
}
function saveForm(id, isNew) {
  const db = load();
  let cook = isNew ? null : db.cooks.find(c=>c.id===id);
  const base = cook || blankCook('single');
  const existing = getCook(id) || {}; // for side count/mode
  const mode = (existing.mode) || (document.querySelectorAll('.side').length>1?'compare':'single');
  const sideCount = document.querySelectorAll('.side').length;
  const val = q => { const el=document.getElementById(q); return el?el.value:''; };
  const sides = [];
  for (let i=0;i<sideCount;i++){
    const s = { name: val(`s${i}_name`) };
    SIDE_GROUPS.forEach(g=>g.fields.forEach(f=>{ s[f.k] = f.score ? Number(val(`s${i}_${f.k}`))||0 : val(`s${i}_${f.k}`); }));
    sides.push(s);
  }
  const updated = { ...base, id: isNew?base.id:id, mode: sideCount>1?'compare':'single',
    title: val('f_title'), date: val('f_date'), protein: val('f_protein'), plan: val('f_plan'), prep: val('f_prep'),
    sidesPlan: val('f_sidesPlan'), saucePlan: val('f_saucePlan'),
    sides, worked: val('f_worked'), change: val('f_change'), notes: val('f_notes'), verdict: val('f_verdict'),
    experience: [...document.querySelectorAll('#f_experience .exp-chip.on')].map(b=>b.dataset.v),
    updatedAt: Date.now(), createdAt: base.createdAt || Date.now() };
  if (isNew) db.cooks.push(updated); else { const idx=db.cooks.findIndex(c=>c.id===id); db.cooks[idx]=updated; }
  save(db); toast('Cook saved 🔥'); go('/cook/'+updated.id);
}

  } else {

        return `<dt>${esc(m[1])}</dt><dd>${disp}</dd>`;
      }).join('')}</dl></section>`;
  }
  const expRow = (c.experience&&c.experience.length)?`<dt>Overall</dt><dd>${c.experience.map(t=>`<span class="chip on" style="display:inline-block;margin:2px 6px 2px 0">${esc(t)}</span>`).join('')}</dd>`:'';
  const takeaways = expRow + [['worked','What worked'],['change','🎯 Dial in next cook'],['notes','Notes'],['verdict','Verdict']]
    .filter(t=>c[t[0]]).map(t=>`<dt>${t[1]}</dt><dd>${esc(c[t[0]])}</dd>`).join('');
  app.innerHTML = `

}
function toggleStep(id,i){
  const db=load(); const c=db.cooks.find(x=>x.id===id); if(!c)return;
  if(!Array.isArray(c.stepsDone)) c.stepsDone=[];
  const at=c.stepsDone.indexOf(i);
  if(at<0) c.stepsDone.push(i); else c.stepsDone.splice(at,1);
  const y=window.scrollY; save(db); renderDetail(document.getElementById('app'), getCook(id)); window.scrollTo(0,y);
}
function renderClock(app){
  app.innerHTML = `
    <div class="detail-h"><h2>🕒 Cook Clock</h2></div>
    <div class="cc-meta" style="margin-bottom:10px">Work backward from dinner — tells you exactly when to light the fire.</div>
    <section class="card"><div class="fields">
      <div class="fg"><label class="fl" for="ck_eat">Eat at</label><input type="time" id="ck_eat" value="18:00" oninput="calcClock()"></div>
      <div class="fg"><label class="fl" for="ck_cook">Cook time (hours)</label><input type="number" id="ck_cook" value="4" step="0.5" min="0" inputmode="decimal" oninput="calcClock()"></div>
      <div class="fg"><label class="fl" for="ck_rest">Rest (minutes)</label><input type="number" id="ck_rest" value="30" step="5" min="0" inputmode="numeric" oninput="calcClock()"></div>
      <div class="fg"><label class="fl" for="ck_prep">Fire prep — lighting coals (minutes)</label><input type="number" id="ck_prep" value="30" step="5" min="0" inputmode="numeric" oninput="calcClock()"></div>
    </div></section>
    <section class="card"><div class="sec-head"><span class="sec-title">Your timeline</span></div><div class="fields" id="ck_out"></div></section>
    <div style="height:16px"></div>
    <div class="foot-actions"><div class="inner"><button class="btn-ghost btn-sm" onclick="go('/')">← Back</button></div></div>`;
  calcClock();
}
function calcClock(){
  const out=document.getElementById('ck_out'); if(!out) return;
  const g=(id,f)=>{ const el=document.getElementById(id); return el?f(el.value):0; };
  const eat=g('ck_eat',v=>v||'18:00');
  const cook=Math.max(0, g('ck_cook',v=>parseFloat(v))||0);
  const rest=Math.max(0, g('ck_rest',v=>parseInt(v,10))||0);
  const prep=Math.max(0, g('ck_prep',v=>parseInt(v,10))||0);
  const parts=String(eat).split(':'); const eatMin=(Number(parts[0])||0)*60+(Number(parts[1])||0);
  const fmt=m=>{ m=((Math.round(m)%1440)+1440)%1440; let h=Math.floor(m/60); const mm=m%60; const ap=h<12?'AM':'PM'; let hr=h%12; if(hr===0)hr=12; return hr+':'+String(mm).padStart(2,'0')+' '+ap; };
  const pullMin=eatMin-rest;
  const meatOn=pullMin-cook*60;
  const fireOn=meatOn-prep;
  const prevDay=fireOn<0;
  out.innerHTML = `<dl class="kv">
      <dt>🔥 Light the fire by</dt><dd style="color:var(--ember-bright)"><b>${fmt(fireOn)}</b>${prevDay?' <span class="hint">(night before)</span>':''}</dd>
      <dt>🍖 Meat on by</dt><dd>${fmt(meatOn)}</dd>
      <dt>⏲️ Pull &amp; start the rest</dt><dd>${fmt(pullMin)}</dd>
      <dt>🍽️ Plated / eat</dt><dd><b>${fmt(eatMin)}</b></dd>
    </dl>
    <div class="hint" style="margin-top:8px">Total from fire to fork: ${((cook*60+rest+prep)/60).toFixed(1)} hrs.${prevDay?' That start lands the night before — proper low-and-slow.':''}</div>`;
}
function delCook(id){ if(!confirm('Delete this cook? You can restore the most recently deleted cook from Data until another deletion replaces it.'))return; const db=load(); saveRecoveryPoint('delete-cook'); db.cooks=db.cooks.filter(c=>c.id!==id); save(db); toast('Deleted · restore available in Data'); if(location.hash.indexOf('/cook/')>=0) go('/'); else render(); }

// ---- live timeline (tap-to-timestamp; the low-friction capture) ----
function logEvent(id,label){ const db=load(); const c=db.cooks.find(x=>x.id===id); if(!c)return; if(!c.events)c.events=[]; c.events.push({t:Date.now(),label,side:(c.sides.length>1?evtSide:'')}); c.updatedAt=Date.now(); save(db); toast(label+' · '+new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})); renderDetail(document.getElementById('app'),c); }
function addCustomEvent(id){ const el=document.getElementById('customEvt'); const v=(el&&el.value||'').trim(); if(!v)return; el.value=''; logEvent(id,v); }
function delEvent(id,t){ const db=load(); const c=db.cooks.find(x=>x.id===id); if(!c||!c.events)return; c.events=c.events.filter(e=>e.t!==t); save(db); renderDetail(document.getElementById('app'),c); }
function setEvtSide(v,btn){ evtSide=v; document.querySelectorAll('#sideTag .sidebtn').forEach(b=>b.classList.remove('on')); if(btn)btn.classList.add('on'); }

// ---- markdown export (paste into cook-log.md) ----
function cookMarkdown(c) {
  const L=[]; const two=c.sides.length>1;
  L.push(`## ${c.title||c.protein||'Cook'} — ${fmtDate(c.date)}`);
  if(c.protein) L.push(`**Protein:** ${c.protein}`);
  if(c.sidesPlan) L.push(`**Sides:** ${c.sidesPlan}`);
  if(c.saucePlan) L.push(`**Sauce:** ${c.saucePlan}`);
  if(c.plan) L.push(`**Game plan:** ${c.plan}`);
  if(c.prep) L.push(`**Prep:** ${c.prep}`);
  if((c.events||[]).length){ L.push(''); L.push('### Timeline'); c.events.slice().sort((a,b)=>a.t-b.t).forEach(e=>L.push(`- ${new Date(e.t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})} — ${e.label}${e.side&&e.side!=='Both'?` (${e.side})`:''}`)); }
  L.push('');
  if(two){
    const rows=SIDE_GROUPS.flatMap(g=>g.fields);
    L.push(`| Metric | ${c.sides.map((s,i)=>mdCell(s.name||('Cooker '+String.fromCharCode(65+i)))).join(' | ')} |`);
    L.push(`|---|${c.sides.map(()=>'---').join('|')}|`);
    rows.forEach(f=>{ const vals=c.sides.map(s=>{const v=s[f.k];return f.score?(Number(v)?v+'/10':''):mdCell(v||'');}); if(vals.some(v=>v!=='')) L.push(`| ${mdCell(f.label)} | ${vals.join(' | ')} |`); });
  } else {
    const s=c.sides[0]; if(s.name) L.push(`**Cooker:** ${s.name}`);
    SIDE_GROUPS.forEach(g=>{ const has=g.fields.some(f=>{const v=s[f.k];return f.score?Number(v):v;}); if(!has)return;
      L.push(''); L.push(`### ${g.title}`);
      g.fields.forEach(f=>{ const v=s[f.k]; if(f.score?Number(v):v) L.push(`- **${f.label}:** ${f.score?v+'/10':v}`); }); });
  }
  L.push('');
  if(c.experience&&c.experience.length) L.push(`- **Overall:** ${c.experience.join(', ')}`);
  [['worked','What worked'],['change','Dial in next cook'],['notes','Notes'],['verdict','Verdict']].forEach(t=>{ if(c[t[0]]) L.push(`- **${t[1]}:** ${c[t[0]]}`); });
  return L.join('\n');
}
function showMarkdown(id){
  const c=getCook(id); const md=cookMarkdown(c);
  openModalHTML(`<h3>Markdown</h3><p class="hint">Paste into <b>cook-log.md</b> (newest at top).</p>
    <pre class="md" id="mdout">${esc(md)}</pre>
    <div class="row" style="margin-top:12px"><button class="btn-primary" onclick="copyText(document.getElementById('mdout').textContent,this)">Copy to clipboard</button>
    <button class="btn-ghost" onclick="closeModal()">Close</button></div>`);
}

// ---- data backup ----
function openData(){
  const db=load();
  openModalHTML(`<h3>Data & backup</h3>
    <p class="hint">${db.cooks.length} cook(s) stored privately in this browser profile. Nothing is uploaded to a Cook Log account or server database. Cook Log also maintains a second on-device recovery copy when this browser supports IndexedDB.</p>
    <div class="row" style="margin-top:12px">
      <button class="btn-primary" onclick="exportJSON()">⬇ Export backup (.json)</button>
      <button onclick="document.getElementById('impfile').click()">⬆ Import backup</button>
      <input type="file" id="impfile" accept="application/json" style="display:none" onchange="importJSON(this)">
      ${localStorage.getItem(RECOVERY_KEY)?'<button onclick="restoreRecoveryPoint()">↶ Restore last deleted cook</button>':''}
    </div>
    <p class="hint" style="margin-top:14px"><b>Important:</b> the on-device recovery copy is not a substitute for an exported backup. Clearing this site’s browser data or losing this device can remove both copies.</p>
    <p class="hint" style="margin-top:14px">Cookers on file: ${COOKERS.join(', ')}.</p>
    <div class="row" style="margin-top:12px"><button class="btn-ghost" onclick="closeModal()">Close</button></div>`);
}
function exportJSON(){
  const backup={ kind:'cook-log-backup', version:2, exportedAt:new Date().toISOString(), cooks:load().cooks, inventory:loadInv(), onboarded:!!localStorage.getItem(ONB_KEY) };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='cook-log-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  localStorage.setItem(LAST_BACKUP_KEY,String(Date.now()));
  setTimeout(()=>URL.revokeObjectURL(a.href),0); toast('Complete backup downloaded');
}
function importJSON(input){
  const file=input.files[0]; if(!file)return; const r=new FileReader();
  if(file.size>10*1024*1024){ alert('Backup is too large (10 MB maximum).'); return; }
  r.onload=()=>{ try{ const data=JSON.parse(r.result); if(!data||!Array.isArray(data.cooks))throw 0;
    const db=load(); const have=new Set(db.cooks.map(c=>c.id));
    let added=0, skipped=0; data.cooks.forEach(raw=>{
      const rawId=textVal(raw&&raw.id,80);
      if(/^[A-Za-z0-9_-]+$/.test(rawId)&&have.has(rawId)){ skipped++; return; }
      const c=normalizeCook(raw,have); if(c){ db.cooks.push(c); added++; } else skipped++;
    });
    if(data.inventory&&typeof data.inventory==='object'){
      const inv=loadInv(); INV_CATS.forEach(([cat])=>{ if(Array.isArray(data.inventory[cat])) inv[cat]=distinct([...(inv[cat]||[]),...data.inventory[cat].map(v=>textVal(v,200))]); }); saveInv(inv);
    }
    if(data.onboarded) localStorage.setItem(ONB_KEY,'1');
    if(!save(db)) return; toast(`Imported ${added} cook(s)${skipped?`; skipped ${skipped} invalid`:''}`); closeModal(); render();
  }catch{ alert('Not a valid Cook Log backup file.'); } };
  r.readAsText(file);
}

// ---- resilient on-device storage ----
function deviceSnapshot(){
  return {kind:'cook-log-device-snapshot',version:1,savedAt:Date.now(),cooks:load().cooks,inventory:loadInv(),onboarded:!!localStorage.getItem(ONB_KEY),lastBackup:Number(localStorage.getItem(LAST_BACKUP_KEY))||0};
}
function openDeviceDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error||new Error('IndexedDB failed'));
  });
}
async function putDeviceSnapshot(snapshot){
  const db=await openDeviceDB();
  await new Promise((resolve,reject)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(snapshot,'current'); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error); });
  db.close();
}
async function getDeviceSnapshot(){
  const db=await openDeviceDB();
  const value=await new Promise((resolve,reject)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const req=tx.objectStore(IDB_STORE).get('current'); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); });
  db.close(); return value;
}
let mirrorTimer=null;
function mirrorDeviceData(){
  clearTimeout(mirrorTimer);
  mirrorTimer=setTimeout(()=>putDeviceSnapshot(deviceSnapshot()).catch(()=>{}),100);
}
function restoreSnapshot(snapshot){
  if(!snapshot||!Array.isArray(snapshot.cooks)||!snapshot.inventory)return false;
  localStorage.setItem(KEY,JSON.stringify({cooks:snapshot.cooks}));
  localStorage.setItem(INV_KEY,JSON.stringify(snapshot.inventory));
  if(snapshot.onboarded)localStorage.setItem(ONB_KEY,'1');
  if(snapshot.lastBackup)localStorage.setItem(LAST_BACKUP_KEY,String(snapshot.lastBackup));
  return true;
}
async function initDeviceStorage(){
  try{
    const mirror=await getDeviceSnapshot();
    const hasLocal=localStorage.getItem(KEY)!==null||localStorage.getItem(INV_KEY)!==null;
    if(!hasLocal&&mirror&&restoreSnapshot(mirror))toast('Recovered your Cook Log from this device');
    await putDeviceSnapshot(deviceSnapshot());
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch{}
}
function saveRecoveryPoint(reason){
  try{ const s=deviceSnapshot(); s.reason=reason; localStorage.setItem(RECOVERY_KEY,JSON.stringify(s)); return true; }catch{return false;}
}
function restoreRecoveryPoint(){
  try{
    const s=JSON.parse(localStorage.getItem(RECOVERY_KEY));
    if(!confirm('Restore the data saved immediately before the last cook deletion?'))return;
    if(!restoreSnapshot(s))throw 0;
    localStorage.removeItem(RECOVERY_KEY); mirrorDeviceData(); closeModal(); toast('Deleted cook restored'); render();
  }catch{alert('The recovery copy is unavailable or invalid. Use an exported backup if you have one.');}
}

// ---- voice input (point, click, and talk) ----
function supportsSpeech(){ return typeof window!=='undefined' && ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window); }
function dictate(cb, btn){
  if(typeof window!=='undefined' && window.isSecureContext===false){ toast('Voice needs HTTPS or localhost — use the keyboard mic instead'); return; }
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Voice not supported in this browser — use the keyboard mic'); return; }
  let r; try{ r=new SR(); }catch(e){ toast('Voice unavailable'); return; }
  r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
  if(btn) btn.classList.add('listening');
  r.onresult=e=>{ try{ cb(e.results[0][0].transcript); }catch(_){} };
  r.onerror=ev=>{ const x=ev&&ev.error;
    if(x==='not-allowed'||x==='service-not-allowed') toast('Mic blocked — allow the microphone for this site in your browser settings');
    else if(x==='audio-capture') toast('No microphone found');
    else if(x==='network') toast('Voice needs a network connection');
    else if(x==='no-speech') toast('Didn’t catch that — try again');
    else toast('Voice error'+(x?': '+x:''));
  };
  r.onend=()=>{ if(btn) btn.classList.remove('listening'); };
  try{ r.start(); toast('Listening… 🎤'); }catch(e){ if(btn) btn.classList.remove('listening'); toast('Couldn’t start mic — '+((e&&e.message)||'try again')); }
}
function micFor(id){ return supportsSpeech()?`<button class="mic" onclick="micInto('${id}',this)">🎤</button>`:''; }
function micInto(id,btn){ dictate(t=>{ const el=document.getElementById(id); if(!el)return; el.value=(el.value?el.value+' ':'')+t; el.focus(); }, btn); }

// ---- modal + clipboard ----
let modalReturnFocus=null;
function openModalHTML(html){ modalReturnFocus=document.activeElement; const m=document.getElementById('modal'); m.innerHTML=html.replace('<h3>','<h3 id="modal-title">'); document.getElementById('modalbg').classList.add('show'); m.focus(); }
function closeModal(){ document.getElementById('modalbg').classList.remove('show'); if(modalReturnFocus&&modalReturnFocus.focus)modalReturnFocus.focus(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('modalbg').classList.contains('show'))closeModal(); });
function copyText(txt,btn){ navigator.clipboard.writeText(txt).then(()=>{ if(btn){const o=btn.textContent;btn.textContent='Copied ✓';setTimeout(()=>btn.textContent=o,1500);} toast('Copied'); }).catch(()=>toast('Could not copy — select the text manually')); }

// ---- install + offline app shell ----
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installPrompt=e; });
window.addEventListener('appinstalled',()=>{ installPrompt=null; document.getElementById('installBtn').hidden=true; toast('Cook Log installed 🔥'); });
function installContext(){
  const ua=navigator.userAgent||'';
  const ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const android=/Android/i.test(ua);
  const edge=/Edg\//i.test(ua);
  const chrome=/(Chrome|CriOS)\//i.test(ua)&&!edge;
  const firefox=/(Firefox|FxiOS)\//i.test(ua);
  const safari=/Safari\//i.test(ua)&&!/(Chrome|CriOS|Edg|FxiOS)\//i.test(ua);
  if(ios) return {label:'iPhone or iPad',steps:safari?'Tap the <b>Share</b> button (square with an up arrow), scroll down, choose <b>Add to Home Screen</b>, then tap <b>Add</b>.':'For a reliable iPhone/iPad installation, open this page in <b>Safari</b>. Tap <b>Share</b> (square with an up arrow), choose <b>Add to Home Screen</b>, then tap <b>Add</b>.'};
  if(android) return {label:'Android',steps:chrome?'Tap Chrome’s <b>three-dot menu</b>, then choose <b>Install app</b> or <b>Add to Home screen</b>.':'Open this page in <b>Chrome</b>, tap the <b>three-dot menu</b>, then choose <b>Install app</b> or <b>Add to Home screen</b>.'};
  if(edge) return {label:'Microsoft Edge',steps:'Open Edge’s <b>three-dot menu</b>, choose <b>Apps</b>, then <b>Install Cook Log</b>.'};
  if(chrome) return {label:'Chrome on a computer',steps:'Click Chrome’s <b>three-dot menu</b>, choose <b>Cast, save, and share</b>, then <b>Install Cook Log</b>. You may also see an install icon at the right end of the address bar.'};
  if(safari) return {label:'Safari on a Mac',steps:'In Safari, choose <b>File → Add to Dock</b>. On older macOS versions without that option, bookmark Cook Log for quick access.'};
  if(firefox) return {label:'Firefox',steps:'Firefox desktop does not currently offer full website-app installation. Open Cook Log in <b>Chrome, Edge, or Safari</b> to install it, or bookmark this page in Firefox.'};
  return {label:'This device',steps:'Open the browser menu and look for <b>Install app</b>, <b>Add to Home Screen</b>, or <b>Add to Dock</b>. Chrome, Edge, and Safari provide the best installation support.'};
}
async function installApp(){
  if(installPrompt){ installPrompt.prompt(); await installPrompt.userChoice; return; }
  const here=installContext();
  openModalHTML(`<h3>Install Cook Log</h3>
    <p>Add Cook Log to your Home Screen, dock, or desktop to launch it like an app and keep the app shell available offline.</p>
    <div class="notice"><b>${here.label} — recommended steps</b><br>${here.steps}</div>
    <p class="hint" style="margin-top:14px"><b>Other devices and browsers</b><br>
      <b>iPhone/iPad (Safari):</b> Share → Add to Home Screen → Add.<br>
      <b>Android (Chrome):</b> three-dot menu → Install app or Add to Home screen.<br>
      <b>Windows (Chrome):</b> three-dot menu → Cast, save, and share → Install Cook Log.<br>
      <b>Windows (Edge):</b> three-dot menu → Apps → Install Cook Log.<br>
      <b>Mac (Safari):</b> File → Add to Dock.<br>
      <b>Mac (Chrome):</b> three-dot menu → Cast, save, and share → Install Cook Log.</p>
    <p class="hint">Your cooks and inventory remain in the browser/profile where you created them. Installing does not yet synchronize data between devices.</p>
    <div class="row"><button class="btn-ghost" onclick="closeModal()">Close</button></div>`);
}
if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true){ document.getElementById('installBtn').hidden=true; }
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>
